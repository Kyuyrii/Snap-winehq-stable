name: winehq-stable
base: core26
adopt-info: winehq-stable
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
summary: A Snap with winehq-stable
description: |
 A content Snap with winehq-stable
grade: stable
confinement: strict
compression: lzo

slots:
  winehq-stable:
    interface: content
    read:
      - /
  little-wine-launcher:
    interface: dbus
    bus: session
    name: io.github.kyuyrii.little-wine-launcher

apps:
  winehq-stable:
    command-chain: [define-variables]
    command: usr/bin/wine
    desktop: winehq-stable.desktop
    common-id: org.winehq.Wine
    extensions: [gnome]
    environment:
      HOME: $SNAP_USER_COMMON
    plugs: &plugs
      - audio-playback
      - network
      - network-bind
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe
  little-wine-launcher:
    command-chain: [define-variables]
    command: usr/bin/little-wine-launcher
    desktop: usr/share/applications/io.github.kyuyrii.little-wine-launcher.desktop
    common-id: io.github.kyuyrii.little-wine-launcher
    extensions: [gnome]
    environment:
      HOME: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
    plugs: *plugs

plugs:
  shared-memory:
    private: true

layout:
  /usr/lib/x86_64-linux-gnu/alsa-lib:
    symlink: $SNAP/usr/lib/x86_64-linux-gnu/alsa-lib
  /usr/share/alsa:
    symlink: $SNAP/usr/share/alsa

package-repositories:
  - type: apt
    url: https://dl.winehq.org/wine-builds/ubuntu
    suites: [resolute]
    components: [main]
    architectures: [amd64]
    key-id: D43F640145369C51D786DDEA76F1A20FF987672F

parts:
  winehq-stable:
    plugin: nil
    stage-packages:
      - winehq-stable
      - x11-xserver-utils
      - libgstreamer1.0-0
      - libgstreamer-gl1.0-0
      - gstreamer1.0-plugins-base
      - libgstreamer-plugins-base1.0-0
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - libgstreamer-plugins-bad1.0-0
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-vaapi
      - gstreamer1.0-alsa
      - gstreamer1.0-gl
      - gstreamer1.0-x
      - gstreamer1.0-plugins-rtp
      - gstreamer1.0-tools
      - libsdl2-2.0-0
      - libdecor-0-0
    override-build: |
      craftctl default
      # Set the snap version from the .deb package version
      craftctl set version=$(dpkg-parsechangelog -l $CRAFT_PART_INSTALL/usr/share/doc/winehq-stable/changelog.*.gz -S Version | sed -e s/1://g)

  little-wine-launcher:
    after: [winehq-stable]
    plugin: make
    source: https://github.com/Kyuyrii/Little-Wine-Launcher.git
#    source-tag: 0.3
    stage-packages: [python3-tomlkit, icoutils]
    make-parameters:
      - PREFIX=/usr
    override-build: |
      craftctl default
      sed -i 's|Icon=io.github.kyuyrii.little-wine-launcher|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/io.github.kyuyrii.little-wine-launcher.svg|' $CRAFT_PART_INSTALL/usr/share/applications/io.github.kyuyrii.little-wine-launcher.desktop

  other-files:
    after: [little-wine-launcher]
    plugin: dump
    source: ./other-files
    organize:
      wine-logo.svg: usr/share/icons/hicolor/scalable/apps/wine-logo.svg
